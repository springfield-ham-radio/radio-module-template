name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require a DCO Signed-off-by line
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          missing=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              Merge\ *) continue ;;
            esac
            body=$(git log -1 --format=%B "$sha")
            if ! printf '%s\n' "$body" | grep -Eq '^Signed-off-by: .+ <[^[:space:]]+>$'; then
              echo "::error::Commit ${sha} is missing a Developer Certificate of Origin Signed-off-by line. Add it with git commit -s, or add a trailer: Signed-off-by: Your Name <you@example.com>"
              missing=1
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          exit "$missing"
